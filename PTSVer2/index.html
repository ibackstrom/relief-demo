<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>particle cloud — PTSVer2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #e6e4e1; }
  /* The canvas is transparent and sits above whatever is behind it, so this drops over an
     existing page as an overlay. The page background here only stands in for that. */
  canvas { display: block; position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12px/1.4 Helvetica, Arial, sans-serif; letter-spacing: .08em;
    color: rgba(0,0,0,.4); text-transform: uppercase; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 12px/1 Helvetica, Arial, sans-serif; letter-spacing: .12em; color: rgba(0,0,0,.5);
    text-transform: uppercase; background: #e6e4e1; transition: opacity .6s ease; z-index: 10;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">loading…</div>
<div id="hint">move the cursor into the cloud</div>
<script type="module" src="./main.js"></script>
</body>
</html>
