<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>particle cloud — PTSVer1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #e6e4e1; }
  /* The canvas is transparent and sits above whatever is behind it, so this drops over an
     existing page as an overlay. The page background here only stands in for that. */
  canvas { display: block; position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12px/1.4 Helvetica, Arial, sans-serif; letter-spacing: .08em;
    color: rgba(0,0,0,.4); text-transform: uppercase; pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 12px/1 Helvetica, Arial, sans-serif; letter-spacing: .12em; color: rgba(0,0,0,.5);
    text-transform: uppercase; background: #e6e4e1; transition: opacity .6s ease; z-index: 10;
  }
  /* the tuning panel — one row per constant in CONFIG, ?ui=0 hides it */
  #ui {
    position: fixed; top: 14px; left: 14px; width: 268px; z-index: 20; max-height: calc(100vh - 28px);
    overflow-y: auto; background: rgba(255,255,255,.82); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,.12); border-radius: 4px; padding: 10px 12px 12px;
    font: 11px/1.35 Helvetica, Arial, sans-serif; color: rgba(0,0,0,.75);
  }
  #ui h2 {
    margin: 0 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(0,0,0,.5);
  }
  #ui .grp {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.10);
    font-size: 10px; font-weight: 600; letter-spacing: .10em; text-transform: uppercase;
    color: rgba(0,0,0,.55);
  }
  #ui .row { margin-top: 6px; }
  #ui .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  #ui .cst { font-family: Consolas, Menlo, monospace; font-size: 10px; color: rgba(0,0,0,.45); }
  #ui .val { font-family: Consolas, Menlo, monospace; font-size: 11px; color: #a41010; }
  #ui input[type=range] { width: 100%; margin: 2px 0 0; accent-color: #a41010; }
  #ui .foot { margin-top: 10px; font-size: 10px; color: rgba(0,0,0,.4); }
  #ui button {
    font: 10px/1 Helvetica, Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 7px; border: 1px solid rgba(0,0,0,.2); border-radius: 3px;
    background: rgba(255,255,255,.7); color: rgba(0,0,0,.6); cursor: pointer;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">loading…</div>
<div id="hint">move the cursor into the cloud</div>
<div id="ui"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
