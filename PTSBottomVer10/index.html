<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora Botanique — Services — ver10 (sparse floating dust)</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face { font-family: Montreal; src: url('./assets/NeueMontreal-Regular.woff2') format('woff2'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0c; }
    #page { position: absolute; width: 100vw; height: 100vh; inset: 0; }
    #background { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    /* The bottom category menu, laid out like the live services page. */
    #categories { position: absolute; left: 0; right: 0; top: 88.95%; height: 30px; transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center; gap: 1.39vw; z-index: 2; }
    #categories button { position: relative; padding: 0 0 9px; border: 0; background: none; cursor: pointer;
      white-space: nowrap; text-transform: uppercase; color: #7a7a7a;
      font: 400 clamp(9px, .81vw, 14px)/1 Montreal, Arial, sans-serif; letter-spacing: .02em; transition: color .3s; }
    #categories button:hover { color: #d6d6d6; }
    #categories button[aria-pressed="true"] { color: #fff; }
    #categories button::after { content: ''; position: absolute; bottom: 0; left: 50%; width: 2.2vw; height: 2px;
      background: #a90015; transform: translateX(-50%) scaleX(0); transition: transform .3s; }
    #categories button[aria-pressed="true"]::after { transform: translateX(-50%) scaleX(1); }
    /* The invisible anchor the particle cloud gathers on. It glides from tab to tab with a
       CSS transition, and the engine reads its box every frame, so the existing population
       flows after it — no respawn, just the cloud travelling. */
    #booknow { position: absolute; z-index: 0; pointer-events: none;
      transition: left 1.9s cubic-bezier(.45,.05,.25,1), top 1.9s cubic-bezier(.45,.05,.25,1),
        width 1.9s cubic-bezier(.45,.05,.25,1), height 1.9s cubic-bezier(.45,.05,.25,1); }
    #status { position: fixed; bottom: 8px; left: 12px; color: #aaa; font: 11px Arial; z-index: 3; }
    /* The tuning rail: hidden unless the page is opened with ?ui=1. */
    #pui {
      position: fixed; top: 0; left: 0; bottom: 0; width: 226px; z-index: 20;
      box-sizing: border-box; overflow-y: auto;
      background: rgba(255,255,255,.88); backdrop-filter: blur(6px);
      border-right: 1px solid rgba(0,0,0,.12); padding: 14px 16px 18px;
      font: 11px/1.35 Helvetica, Arial, sans-serif; color: rgba(0,0,0,.75);
    }
    #pui h2 { margin: 0 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(0,0,0,.5); }
    #pui .row { margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(0,0,0,.10); }
    #pui .row:first-of-type { margin-top: 6px; padding-top: 0; border-top: 0; }
    #pui .lbl { display: flex; justify-content: space-between; align-items: center; gap: 7px; }
    #pui .name { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; }
    #pui .cst { display: block; margin-top: 2px; font-family: Consolas, Menlo, monospace; font-size: 10px; color: rgba(0,0,0,.42); }
    #pui .val { margin-left: auto; font-family: Consolas, Menlo, monospace; font-size: 11px; color: #bf1425; white-space: nowrap; }
    #pui input[type=range] { width: 100%; margin: 5px 0 0; accent-color: #bf1425; }
    #pui .foot { margin-top: 11px; font-size: 10px; color: rgba(0,0,0,.4); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>
  <script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script>
</head>
<body>
  <main id="page">
    <img id="background" src="./assets/aurora-bg.jpg" alt="Aurora Botanique. Services. Advanced skin care.">
    <h1 class="sr-only">Aurora Botanique — Services — particles prototype</h1>
    <div id="booknow" aria-hidden="true"></div>
    <nav id="categories" aria-label="Service category">
      <button type="button" aria-pressed="true">Cosmetology</button>
      <button type="button" aria-pressed="false">Makeup / Brows</button>
      <button type="button" aria-pressed="false">Stylists</button>
      <button type="button" aria-pressed="false">Manicure</button>
      <button type="button" aria-pressed="false">SPA</button>
    </nav>
  </main>
  <div id="status" role="status">Loading particles…</div>
  <div id="pui" hidden></div>
  <script type="module">
    const anchor = document.getElementById('booknow');
    const buttons = [...document.querySelectorAll('#categories button')];

    // Park the gather anchor over the pressed tab. Called once before the engine loads
    // (its first frame reads this box) and on every click afterwards.
    const syncAnchor = () => {
      const active = buttons.find(b => b.getAttribute('aria-pressed') === 'true') || buttons[0];
      const r = active.getBoundingClientRect();
      anchor.style.left = r.left + 'px';
      anchor.style.top = r.top + 'px';
      anchor.style.width = r.width + 'px';
      anchor.style.height = r.height + 'px';
    };
    syncAnchor();
    addEventListener('resize', syncAnchor);

    for (const button of buttons) {
      button.addEventListener('click', () => {
        for (const item of buttons) item.setAttribute('aria-pressed', String(item === button));
        syncAnchor();
      });
      button.addEventListener('keydown', event => {
        const direction = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
        if (!direction) return;
        event.preventDefault();
        const next = buttons[(buttons.indexOf(button) + direction + buttons.length) % buttons.length];
        next.focus();
        next.click();
      });
    }
    try {
      await document.fonts.ready;
      syncAnchor();
      await import('./main.js');
      document.getElementById('status').remove();
    } catch (error) {
      document.getElementById('status').textContent = 'Particles could not load. Please use a browser with WebGL enabled.';
      console.error(error);
    }
  </script>
</body>
</html>
